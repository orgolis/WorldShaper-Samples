# Online with a code (the Online buttons). With no lobby server named here, the
# games find each other themselves -- on this network, and over the internet
# through the public DHT -- and connect directly; that gets through most home
# routers. For the networks it cannot (some mobile / carrier ones), run
# lobby_server on a machine the internet reaches and name it here
# (docs/systems/ONLINE_PLAY.md, "Lobby codes"):
# lobby_server=your.server.address:7780
